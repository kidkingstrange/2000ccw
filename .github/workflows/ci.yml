name: CI / CD Release Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_release:
    name: Build Production Release (APK & AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Puzzles Compilation
        run: |
          python tools/build_titles.py
          python tools/build_clues.py
          python tools/compile_puzzles.py

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Run Static Code Analysis
        run: dart analyze --fatal-infos

      - name: Run Test Suite
        run: flutter test --coverage

      - name: Build Production Release APK (No Debug)
        run: flutter build apk --release

      - name: Build Production Release App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Create or Update GitHub Production Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "2000s Toon Crosswords v1.0.0 (Production Release)"
          draft: false
          prerelease: false
          body: |
            ## 📺 2000s Toon Crosswords v1.0.0 (Production Release)

            > **If you are a child of the 2000s, this is the game you were born to play!**

            Official production release built strictly in **Release Mode** (signed with production upload keystore, zero debugger attached).

            ### Included Release Files:
            - **`app-release.apk`**: Direct standalone Android installation package.
            - **`app-release.aab`**: Google Play Console release bundle for production publishing.

            ### Highlights:
            - **100% Offline & Zero Permission**: Zero internet permissions declared in AndroidManifest.xml. Zero tracking, zero ads.
            - **400 Launch Levels**: 200 Classic Crosswords across 4 tiers + 200 Emoji Title Rebus Puzzles.
            - **157 Verified Cartoons**: Cartoon Network, JimJam, Nickelodeon, Kids' WB, KidsCo, Disney Channel & Jetix, Teletoon.
            - **2,612 Verified Clues**: Double-source verified factual trivia.
            - **Systems**: 3-Tier Hint Shop, Trophy Hall / Dex, and Daily Challenge Streak.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
