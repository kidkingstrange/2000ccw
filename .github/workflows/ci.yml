name: CI / CD Release Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_release:
    name: Build Production Release (APK & AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Puzzles Compilation
        run: |
          python tools/build_titles.py
          python tools/build_clues.py
          python tools/compile_puzzles.py

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Run Static Code Analysis
        run: dart analyze --fatal-infos

      - name: Run Test Suite
        run: flutter test --coverage

      - name: Build Production Release APK (No Debug)
        run: flutter build apk --release

      - name: Build Production Release App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Create or Update GitHub Production Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.3
          name: "2000s Toon Crosswords v1.0.3 (Luxury Editorial Redesign)"
          draft: false
          prerelease: false
          overwrite: true
          body: |
            ## 📺 2000s Toon Crosswords v1.0.3 (Luxury Editorial Redesign)

            > **If you are a child of the 2000s, this is the game you were born to play!**

            Official production release built strictly in **Release Mode** with signed production upload keystore.

            ### 📦 Included Downloadable Files:
            - **[Direct APK Download (app-release.apk)](https://github.com/kidkingstrange/2000ccw/releases/download/v1.0.3/app-release.apk)**: Standalone Android APK ready to sideload and install directly on any Android device!
            - **[Play Store Bundle (app-release.aab)](https://github.com/kidkingstrange/2000ccw/releases/download/v1.0.3/app-release.aab)**: Google Play Console release bundle for production and internal testing tracks.

            ### 🚀 Highlights in v1.0.3 (Luxury Editorial Redesign):
            - **Luxury Editorial Aesthetic**: Replaced clunky comic outlines with refined paper cards, Slate 50 canvas, and soft multi-layer ambient shadows benchmarked against Apple Design Award winners and NYT Crossword.
            - **Typography & Color Harmony**: High-contrast Slate 900 text, Sky Blue active cell focus ring, soft mint solve states, and fixed contrast issues across dialogs and cards.
            - **Polished Iconography**: Replaced raw OS emojis with custom vector icon badges and subtle gradients for streaks, coins, and modes.
            - **Native Phone Keyboard Only**: Seamless Gboard, Samsung Keyboard, and iOS keyboard input channeling.
            - **Zero Answer Leaks**: All 2,610 crossword clues and 200 rebus riddles completely sanitized with zero spoilers.
            - **100% Offline & Ad-Free**: Zero network permissions (`android.permission.INTERNET` omitted), zero ads, zero trackers.
            - **400 Launch Levels**: 200 Classic Crosswords + 200 Emoji Title Rebuses across 7 channel packs.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
